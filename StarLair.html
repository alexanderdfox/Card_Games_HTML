<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Infinite 6DOF StarLair - Cinematic Space</title>
<style>
body {
	margin:0;
	overflow:hidden;
	background:black;
	font-family:sans-serif;
	color:white;
	cursor:none;
}
#scoreDisplay, #qteDisplay, #controlsDisplay {
	position:absolute;
	font-size:18px;
	z-index:1000;
}
#scoreDisplay { top:20px; left:20px; }
#qteDisplay { top:20px; right:20px; }
#controlsDisplay { bottom:20px; left:20px; }
#sceneContainer {
	position:absolute;
	width:100%;
	height:100%;
	overflow:hidden;
	transform-style: preserve-3d;
}
.object {
	position:absolute;
	border-radius:50%;
	transform-origin:center center;
	filter: drop-shadow(0 0 15px rgba(255,255,255,0.8)) contrast(1.3) brightness(1.5);
	transition: transform 0.1s linear;
}
.trail {
	filter: blur(3px) brightness(1.2);
	opacity:0.4;
}
.star {
	position:absolute;
	border-radius:50%;
	filter: blur(1.5px) brightness(1.2);
}
#mouseOverlay {
	display:none;
	position:fixed;
	top:0; left:0;
	width:100%; height:100%;
	background:rgba(0,0,0,0.9);
	color:white;
	font-size:32px;
	text-align:center;
	line-height:100vh;
	z-index:9999;
	cursor:pointer;
}
#epilepsyOverlay {
	display:flex;
	justify-content:center;
	align-items:center;
	position:fixed;
	top:0; left:0;
	width:100%; height:100%;
	background:black;
	color:red;
	font-size:36px;
	text-align:center;
	z-index:10000;
	flex-direction:column;
	cursor:pointer;
}
#epilepsyOverlay span {
	font-size:24px;
	margin-top:20px;
	color:white;
}
canvas#nebulaCanvas {
	position:absolute;
	top:0; left:0;
	width:100%; height:100%;
	z-index:-1;
}
</style>
</head>
<body>
<div id="scoreDisplay">Score: 0</div>
<div id="qteDisplay">QTE: -</div>
<div id="controlsDisplay">
W/S: Forward/Backward | A/D: Strafe | Space/Shift: Up/Down | Q/E: Roll | Mouse: Look
</div>
<div id="sceneContainer"></div>
<div id="mouseOverlay">Mouse left the screen! Click to resume.</div>
<div id="epilepsyOverlay">
⚠️ Epilepsy Warning! ⚠️
<span>Flashing lights may be present. Click anywhere to start.</span>
</div>
<canvas id="nebulaCanvas"></canvas>

<script>
// ---------- GAME STATE ----------
let score = 0;
let paused = true;
const QTE_CHOICES = [
	{action:"FORWARD", key:"w"}, {action:"BACKWARD", key:"s"},
	{action:"STRAFE LEFT", key:"a"}, {action:"STRAFE RIGHT", key:"d"},
	{action:"UP", key:" "}, {action:"DOWN", key:"Shift"},
	{action:"ROLL LEFT", key:"q"}, {action:"ROLL RIGHT", key:"e"}
];
let activeQTE = null;
let sceneColors = {object1:"#FFAA00", object2:"#00FFFF", nebula:[]};

// ---------- CAMERA / PLAYER ----------
let camera = { x:0, y:0, z:0, pitch:0, yaw:0, roll:0, speed:5 };
let keys = {w:0,s:0,a:0,d:0,space:0,shift:0,q:0,e:0};
let mouse = {dx:0, dy:0};

// ---------- INPUT ----------
document.addEventListener('keydown', e=>{
	if(paused) return;
	switch(e.code){
		case 'KeyW': keys.w=1; break; case 'KeyS': keys.s=1; break;
		case 'KeyA': keys.a=1; break; case 'KeyD': keys.d=1; break;
		case 'Space': keys.space=1; break; case 'ShiftLeft': keys.shift=1; break;
		case 'KeyQ': keys.q=1; break; case 'KeyE': keys.e=1; break;
	}
	if(activeQTE){ let pressed=false;
		switch(activeQTE.key){
			case 'w': pressed=keys.w; break; case 's': pressed=keys.s; break;
			case 'a': pressed=keys.a; break; case 'd': pressed=keys.d; break;
			case ' ': pressed=keys.space; break; case 'Shift': pressed=keys.shift; break;
			case 'q': pressed=keys.q; break; case 'e': pressed=keys.e; break;
		}
		if(pressed){ handleQTE(true); }
	}
});
document.addEventListener('keyup', e=>{
	switch(e.code){
		case 'KeyW': keys.w=0; case 'KeyS': keys.s=0;
		case 'KeyA': keys.a=0; case 'KeyD': keys.d=0;
		case 'Space': keys.space=0; case 'ShiftLeft': keys.shift=0;
		case 'KeyQ': keys.q=0; case 'KeyE': keys.e=0;
	}
});
document.body.addEventListener('mousemove', e=>{
	if(!paused){ mouse.dx = e.movementX*0.003; mouse.dy = e.movementY*0.003; }
});
document.body.addEventListener('click', ()=>document.body.requestPointerLock());

// ---------- OVERLAYS ----------
const overlay = document.getElementById("mouseOverlay");
const epilepsyOverlay = document.getElementById("epilepsyOverlay");
window.addEventListener('mouseout', e=>{
	if(!e.relatedTarget && !paused){
		paused=true; overlay.style.display='block'; epilepsyOverlay.style.display='flex';
	}
});
overlay.addEventListener('click', ()=>{
	paused=false; overlay.style.display='none'; epilepsyOverlay.style.display='none';
});
epilepsyOverlay.addEventListener('click', ()=>{
	paused=false; epilepsyOverlay.style.display='none';
});

// ---------- STARFIELD ----------
let stars=[];
function generateStars(count=200){
	stars=[];
	for(let i=0;i<count;i++){
		stars.push({
			x:(Math.random()-0.5)*3000, y:(Math.random()-0.5)*3000,
			z:(Math.random()-0.5)*3000, size: Math.random()*2+1,
			color: `hsl(${Math.random()*360},60%,80%)`
		});
	}
}

// ---------- SCENE ----------
let objects=[];
function randomColor(){ return `hsl(${Math.random()*360},70%,60%)`; }
function generateScene(){
	objects=[];
	sceneColors.object1 = randomColor();
	sceneColors.object2 = randomColor();
	sceneColors.nebula = [];
	for(let i=0;i<50;i++){
		sceneColors.nebula.push(`hsla(${Math.random()*360},60%,40%,0.1)`);
	}

	for(let i=0;i<70;i++){
		objects.push({
			x:(Math.random()-0.5)*2000, y:(Math.random()-0.5)*2000, z:(Math.random()-0.5)*2000,
			size:Math.random()*40+15,
			color: Math.random()<0.5?sceneColors.object1:sceneColors.object2
		});
	}

	activeQTE = QTE_CHOICES[Math.floor(Math.random()*QTE_CHOICES.length)];
	document.getElementById("qteDisplay").innerText = "QTE: "+activeQTE.action;
}

// ---------- QTE HANDLER ----------
function handleQTE(success){ if(success){ score++; }
	document.getElementById("scoreDisplay").innerText = "Score: "+score;
	generateScene();
}

// ---------- NEBULA ----------
const nebulaCanvas = document.getElementById("nebulaCanvas");
const nebCtx = nebulaCanvas.getContext("2d");
nebulaCanvas.width = window.innerWidth;
nebulaCanvas.height = window.innerHeight;

let nebulaParticles=[];
function generateNebulaParticles(){
	nebulaParticles=[];
	for(let i=0;i<sceneColors.nebula.length;i++){
		nebulaParticles.push({
			x: Math.random()*window.innerWidth,
			y: Math.random()*window.innerHeight,
			radius: Math.random()*100+50,
			color: sceneColors.nebula[i],
			dx: (Math.random()-0.5)*0.2, dy: (Math.random()-0.5)*0.2
		});
	}
}

function renderNebula(){
	nebCtx.clearRect(0,0,nebulaCanvas.width,nebulaCanvas.height);
	nebulaParticles.forEach(p=>{
		nebCtx.beginPath();
		let grd = nebCtx.createRadialGradient(p.x,p.y,p.radius*0.2,p.x,p.y,p.radius);
		grd.addColorStop(0,p.color); grd.addColorStop(1,'rgba(0,0,0,0)');
		nebCtx.fillStyle = grd; nebCtx.fill();
		p.x+=p.dx; p.y+=p.dy;
		if(p.x<0) p.x=window.innerWidth; if(p.x>window.innerWidth) p.x=0;
		if(p.y<0) p.y=window.innerHeight; if(p.y>window.innerHeight) p.y=0;
	});
}

// ---------- UPDATE ----------
function update(){
	if(paused) return;
	let forward = keys.w - keys.s, right = keys.d - keys.a, up = keys.space - keys.shift;
	camera.x += forward*Math.sin(camera.yaw)*camera.speed + right*Math.cos(camera.yaw)*camera.speed;
	camera.z += forward*Math.cos(camera.yaw)*camera.speed - right*Math.sin(camera.yaw)*camera.speed;
	camera.y += up*camera.speed;
	camera.yaw += mouse.dx; camera.pitch -= mouse.dy;
	mouse.dx=0; mouse.dy=0;
	camera.roll += (keys.q - keys.e)*0.02;
}

// ---------- MAIN LOOP ----------
function renderScene(){
	const container = document.getElementById("sceneContainer");
	container.innerHTML="";
	const cosPitch=Math.cos(camera.pitch), sinPitch=Math.sin(camera.pitch);
	const cosYaw=Math.cos(camera.yaw), sinYaw=Math.sin(camera.yaw);
	const cosRoll=Math.cos(camera.roll), sinRoll=Math.sin(camera.roll);

	// Stars
	stars.forEach(s=>{
		let dx=s.x-camera.x, dy=s.y-camera.y, dz=s.z-camera.z;
		let x1=dx*cosYaw - dz*sinYaw, z1=dx*sinYaw + dz*cosYaw, y1=dy;
		let y2=y1*cosPitch - z1*sinPitch, z2=y1*sinPitch + z1*cosPitch, x2=x1;
		let x3=x2*cosRoll - y2*sinRoll, y3=x2*sinRoll + y2*cosRoll, z3=z2;
		let scale=800/(800+z3);
		let left=window.innerWidth/2 + x3*scale, top=window.innerHeight/2 + y3*scale;
		const div=document.createElement("div");
		div.className="star";
		div.style.width=div.style.height=s.size+"px";
		div.style.left=left+"px"; div.style.top=top+"px";
		div.style.backgroundColor=s.color;
		container.appendChild(div);
	});

	// Objects
	objects.forEach(obj=>{
		let dx=obj.x-camera.x, dy=obj.y-camera.y, dz=obj.z-camera.z;
		let x1=dx*cosYaw - dz*sinYaw, z1=dx*sinYaw + dz*cosYaw, y1=dy;
		let y2=y1*cosPitch - z1*sinPitch, z2=y1*sinPitch + z1*cosPitch, x2=x1;
		let x3=x2*cosRoll - y2*sinRoll, y3=x2*sinRoll + y2*cosRoll, z3=z2;
		let scale=800/(800+z3);
		let left=window.innerWidth/2 + x3*scale - obj.size/2;
		let top=window.innerHeight/2 + y3*scale - obj.size/2;
		const div=document.createElement("div");
		div.className="object";
		div.style.width=div.style.height=obj.size+"px";
		div.style.left=left+"px"; div.style.top=top+"px";
		div.style.backgroundImage=`radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), ${obj.color})`;
		container.appendChild(div);
		const trail = div.cloneNode(true); trail.classList.add("trail"); container.appendChild(trail);
	});
}

// ---------- LOOP ----------
function loop(){ update(); renderNebula(); renderScene(); requestAnimationFrame(loop); }

// ---------- START ----------
generateStars(); generateScene(); generateNebulaParticles(); loop();
</script>
</body>
</html>
